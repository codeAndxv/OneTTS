# OneTTS 模型与服务配置文件

# API Key（所有接口必须携带此 key，支持 Bearer / X-API-Key）
api_key: sk-onetts-v1-k9L3mX8QZ2sT4vA7wE1rY6u

# 模型生命周期与显存管理配置（Ollama 风格智能加载与释放）
model_manager:
  default_keep_alive: 600        # 默认空闲存活时长（秒，支持 "10m" / 600 / -1 常驻 / 0 用完即焚）
  max_loaded_models: 2           # 最大同时驻留显存/内存的非常驻本地模型数
  cleanup_interval: 30           # 后台空闲模型回收巡检间隔（秒）

# TTS 全局切片与缓存配置
TTS-Toolkit:
  # 音频合成智能缓存
  cache:
    enable: true
    cache_dir: "data/outputs/cache"
    max_cache_size_mb: 1024

  # 长文本流式切片分句
  text_splitter:
    enable: true
    max_chunk_chars: 80
    split_delimiters: "。！？!?；;\n"

# ─────────────────────────────────────────────────────────────
# 本地模型配置 (local-models)
# Key 为对外暴露的 model_id，由用户/业务自由命名；
# driver 指定底层模型系列（kokoro, cosyvoice, f5tts 等）；
# 模型文件映射至 data/models/<目录名>，受 ModelManager 内存/显存调度。
# ─────────────────────────────────────────────────────────────
local-models:

  # 1. Kokoro 超轻量 ONNX 引擎 (82M 超轻量，低延迟高自然度，支持 CPU / GPU)
  kokoro-v0_19:
    enable: false
    driver: kokoro
    preload: false               # 启动时是否预热载入内存
    keep_alive: 600              # 空闲 10 分钟后自动卸载释放显存/内存

    load:
      model_path: "data/models/kokoro-v0_19.onnx"
      voices_path: "data/models/voices.bin"
      device: cpu

    capabilities:
      categories:
        - PresetTTS              # 预置音色合成
      default_voice: "af_bella"

  # 2. CosyVoice 阿里开源零样本声音克隆模型 (支持本地权重常驻或自建推理节点)
  cosyvoice-300m:
    enable: false
    driver: cosyvoice
    preload: false
    keep_alive: 600

    load:
      api_url: "http://127.0.0.1:9233"
      model_dir: null

    capabilities:
      categories:
        - VoiceCloneTTS          # 音色复刻 / 声音克隆
        - PresetTTS              # 预置发音人合成
      default_voice: "cosyvoice-chinese-female"

  # 3. F5-TTS 清华非自回归极速声音克隆模型
  f5tts-base:
    enable: false
    driver: f5tts
    preload: false
    keep_alive: 600

    load:
      api_url: "http://127.0.0.1:9998"
      model_path: "data/models/F5-TTS"

    capabilities:
      categories:
        - VoiceCloneTTS          # 音色复刻 / 零样本声音克隆
      default_voice: "f5-chinese-female"

# ─────────────────────────────────────────────────────────────
# 云端 / Web 服务商配置 (cloud-providers)
# 厂商账号凭据集中配置，一处配置 connection 即可激活其下全部模型；
# 云端/Web 模型免本地权重下载，不占用本机显存，亦不受 ModelManager 淘汰管辖。
# ─────────────────────────────────────────────────────────────
cloud-providers:

  # 1. 微软 Edge 在线高质量语音 (WebTTS 免 Key 免显卡，开箱即用支持上百种音色)
  edge-cloud:
    enable: true
    driver: edgetts
    connection:
      proxy: null
      connect_timeout: 5
    models:
      - id: "edgetts"
        categories:
          - PresetTTS            # 预置音色合成
        default_voice: "zh-CN-XiaoxiaoNeural"

  # 2. 官方 OpenAI 语音服务 (一 Key 激活标准 tts-1 与高清 tts-1-hd)
  openai-official:
    enable: false
    driver: openai
    connection:
      base_url: "https://api.openai.com/v1"
      api_key: "sk-xxxxxx"
      timeout: 30
      max_retries: 3
    models:
      - id: "tts-1"
        remote_name: "tts-1"
        categories:
          - PresetTTS            # 预置音色合成
        default_voice: "alloy"
      - id: "tts-1-hd"
        remote_name: "tts-1-hd"
        categories:
          - PresetTTS            # 预置音色合成
        default_voice: "alloy"

  # 3. 字节跳动 豆包 / 火山语音大模型 (商业级拟真音色)
  doubao-volcano:
    enable: false
    driver: doubao
    connection:
      api_url: "https://openspeech.bytedance.com/api/v1/tts"
      appid: "your_appid"
      access_token: "your_access_token"
      cluster: "volcano_tts"
      timeout: 30
    models:
      - id: "doubao"
        categories:
          - PresetTTS            # 预置音色合成
        default_voice: "zh_female_shuangkuai"
